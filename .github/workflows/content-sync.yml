# Keeps the deployed copy of the site in step with the Lab Dashboard.
# Visitors see published changes at once (their browser checks Firestore); this rebuild bakes them into
# the files too, so search engines and link previews see them and pages load without database reads.
name: Sync dashboard content
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  checks: write
concurrency: content-sync
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Anything published since the last deploy?
        id: check
        run: node scripts/bake-content.mjs --check
      - name: Bake content published from the Lab Dashboard
        if: steps.check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: node scripts/bake-content.mjs
      - name: Build LabBoard (served at /update)
        if: steps.check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        working-directory: labboard
        run: |
          npm ci
          npm run build
      - name: Deploy to Firebase Hosting
        if: steps.check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AFMN_LAB }}
          channelId: live
          projectId: afmn-lab
